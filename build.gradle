plugins {
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    id 'idea'
    id 'project-report'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withJavadocJar()
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release.set(17)
}

group = 'io.github.mderevyankoaqa'
version = '1.1'

repositories {
    mavenCentral()
}

def title = 'MongoBackendClient'
def archiveName = 'jmeter-mongo-listener-plugin'

dependencies {
    implementation 'org.apache.jmeter:ApacheJMeter_core:5.6.3'
    implementation 'org.apache.jmeter:ApacheJMeter_java:5.6.3'
    implementation 'org.apache.jmeter:ApacheJMeter_components:5.6.3'
    implementation 'org.apache.jmeter:jorphan:5.6.3'
    implementation 'org.apache.jmeter:ApacheJMeter_http:5.6.3'

    implementation 'org.apache.commons:commons-lang3:3.14.0'
    implementation 'org.mongodb:mongodb-driver-sync:4.11.1' // Downgraded for JMeter compatibility
    runtimeOnly 'org.slf4j:slf4j-api:2.0.13'
}

tasks.named('jar') {
    manifest {
        attributes(
                'Implementation-Title': title,
                'Implementation-Version': project.version,
                'Main-Class': 'io.github.mderevyankoaqa.mongo.visualizer.MongoBackendClient'
        )
    }
}

tasks.named('sourcesJar') {
    archiveClassifier.set('sources')
}

shadowJar {
    archiveBaseName.set(archiveName)
    archiveClassifier.set('')
    archiveVersion.set(project.version)

    manifest {
        attributes(
                'Implementation-Title': title,
                'Implementation-Version': project.version,
                'Main-Class': 'io.github.mderevyankoaqa.mongo.visualizer.MongoBackendClient'
        )
    }

    // Relocate Mongo classes to avoid JMeter classpath conflicts
    relocate 'com.mongodb', 'io.github.mderevyankoaqa.shaded.com.mongodb'
    relocate 'org.bson', 'io.github.mderevyankoaqa.shaded.org.bson'

    mergeServiceFiles()

    // --- ADD THIS LINE HERE ---
    // This tells Shadow to ignore Java 21 specific files inside dependencies
    exclude 'META-INF/versions/**'
    // --------------------------

    minimize {
        exclude dependency('org.slf4j:slf4j-api')
        exclude dependency('org.apache.commons:commons-lang3')
        exclude dependency('org.apache.logging.log4j:log4j-api')
        exclude dependency('org.apache.logging.log4j:log4j-core')
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = archiveName
            from components.java

            pom {
                name = 'JMeter MongoDB Backend Listener'
                description = 'MongoDB backend listener plugin for Apache JMeter. Supports batching, transaction controllers, and detailed assertion reporting.'
                url = 'https://github.com/mderevyankoaqa/jmeter-mongo-listener-plugin'

                licenses {
                    license {
                        name = 'Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0'
                    }
                }
                developers {
                    developer {
                        id = 'mderevyanko'
                        name = 'Mike Derevianko'
                        email = 'm.v.derevyanko@gmail.com'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/mderevyankoaqa/jmeter-mongo-listener-plugin.git'
                    developerConnection = 'scm:git:ssh://git@github.com/mderevyankoaqa/jmeter-mongo-listener-plugin.git'
                    url = 'https://github.com/mderevyankoaqa/jmeter-mongo-listener-plugin'
                }
            }
        }
    }

    repositories {
        maven {
            name = 'OSSRH'
            url = 'https://s01.oss.sonatype.org/service/local/staging/deploy/maven2/'
            credentials {
                username = project.properties['ossrhUsername']
                password = project.properties['ossrhPassword']
            }
        }
    }
}

signing {
    sign publishing.publications.mavenJava
}

tasks.named('javadoc') {
    if (JavaVersion.current().isJava9Compatible()) {
        options.addBooleanOption('html5', true)
    }
}
